<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE YOU BELLA</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070a1f;
    font-family: Georgia, "Times New Roman", serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

const stars = Array.from({length: 150}, () => ({
  x: Math.random(),
  y: Math.random(),
  r: Math.random() * 1.8 + 0.4,
  a: Math.random() * Math.PI * 2,
  s: Math.random() * 0.02 + 0.006
}));

function heart(t) {
  return {
    x: 16 * Math.sin(t) ** 3,
    y: 13 * Math.cos(t) - 5 * Math.cos(2*t)
       - 2 * Math.cos(3*t) - Math.cos(4*t)
  };
}

let angle = 0;
let hue = 330;

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Langit malam
  const g = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, Math.max(W,H)*0.75);
  g.addColorStop(0, "#17133b");
  g.addColorStop(0.55, "#0b0d29");
  g.addColorStop(1, "#030513");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Bintang
  for (const s of stars) {
    s.a += s.s;
    const alpha = 0.45 + 0.55 * (0.5 + 0.5*Math.sin(s.a));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#fff7ff";
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Bulan kecil
  ctx.fillStyle = "#fff3c4";
  ctx.shadowColor = "#fff3c4";
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.arc(W-75, 75, 24, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#070a1f";
  ctx.beginPath();
  ctx.arc(W-64, 68, 24, 0, Math.PI*2);
  ctx.fill();

  // Posisi mengikuti hati
  const p = heart(angle);
  const scale = Math.min(W, H) / 38;
  const x = W/2 + p.x * scale;
  const y = H/2 - p.y * scale;

  // Ukuran teks responsif
  const size = Math.max(28, Math.min(58, W / 9));
  const text = "I LOVE YOU BELLA";

  ctx.font = `bold ${size}px Georgia, "Times New Roman", serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // Glow
  ctx.shadowColor = `hsl(${hue}, 85%, 70%)`;
  ctx.shadowBlur = 28;
  ctx.fillStyle = `hsl(${hue}, 90%, 75%)`;
  ctx.fillText(text, x, y);

  // Lapisan putih agar elegan
  ctx.shadowBlur = 8;
  ctx.fillStyle = "#fff4fb";
  ctx.fillText(text, x, y);

  ctx.shadowBlur = 0;

  // Keterangan kecil
  ctx.font = `italic ${Math.max(12, Math.min(17, W/35))}px Georgia`;
  ctx.fillStyle = "rgba(255,255,255,.65)";
  ctx.fillText("✨ with love ✨", W/2, H-35);

  angle += 0.018;
  hue = (hue + 0.08) % 360;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
